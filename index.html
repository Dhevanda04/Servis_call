<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layanan Service Laptop & Elektronik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🔧 Layanan Service Elektronik</h1>
    <p>Laptop • HP • PC • CCTV • Printer • DLL</p>

    <form id="serviceForm">
        <input type="text" id="nama" placeholder="Nama Lengkap" required>
        <input type="text" id="hp" placeholder="Nomor HP / WhatsApp" required>

        <select id="jenis" required>
            <option value=""> Pilih Jenis Perangkat </option>
            <option>Laptop</option>
            <option>HP</option>
            <option>PC</option>
            <option>CCTV</option>
            <option>Printer</option>
            <option>Lainnya</option>
        </select>

        <textarea id="kendala" placeholder="Jelaskan kendala / kerusakan" required></textarea>

        <button type="submit">📲 Kirim ke WhatsApp</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html
